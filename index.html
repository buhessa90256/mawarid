<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>موارد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f3f6f8;--card:#fff;--ink:#14303a;--muted:#5b717a;--line:#d7e2e6;--teal:#0f766e;--teal-dark:#0b5b55;--navy:#16324f;--danger:#b42318;--ok:#067647;--warn:#b54708;--shadow:0 10px 30px rgba(20,48,58,.08)}
    *{box-sizing:border-box} html,body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
    button,input,select,textarea{font-family:inherit}
    .hidden{display:none!important}
    .shell{display:flex;min-height:100vh}
    .side{width:250px;background:linear-gradient(180deg,#102833,#16324f);color:#e8f3f4;padding:18px 12px;display:flex;flex-direction:column}
    .brand{display:flex;gap:10px;align-items:center;padding:6px 8px 18px}
    .logo{width:42px;height:42px;border-radius:12px;background:var(--teal);display:grid;place-items:center;font-weight:800;font-size:22px}
    .brand small{display:block;color:#9fb4bc;font-size:12px}
    .nav a{display:block;color:#d5e6ea;padding:10px 12px;border-radius:10px;text-decoration:none;margin-bottom:4px;cursor:pointer}
    .nav a:hover,.nav a.on{background:rgba(255,255,255,.08);color:#fff}
    .side-user{margin-top:auto;display:flex;gap:8px;align-items:center;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
    .avatar{width:34px;height:34px;border-radius:50%;background:#1f6f69;display:grid;place-items:center;font-weight:700}
    .side-user small{display:block;color:#9fb4bc;font-size:12px}
    .logout{margin-inline-start:auto;background:none;border:0;color:#f2c9c6;cursor:pointer}
    .main{flex:1;min-width:0}
    .top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
    .top h1{margin:0;font-size:20px;flex:1}
    .menu{display:none;border:0;background:#eef4f5;border-radius:10px;padding:8px 12px}
    .content{padding:22px;max-width:1100px}
    .grid{display:grid;gap:14px}
    .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
    .stat{font-size:32px;font-weight:800;color:var(--navy)}
    .muted{color:var(--muted);font-size:14px}
    table{width:100%;border-collapse:collapse;min-width:560px}
    th,td{text-align:right;padding:9px 7px;border-bottom:1px solid var(--line);font-size:14px}
    th{color:var(--muted)}
    .wrap{overflow-x:auto}
    .btn{border:0;background:var(--teal);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
    .btn:hover{background:var(--teal-dark)}
    .btn.sec{background:#e8eef0;color:var(--ink)}
    .btn.danger{background:var(--danger)}
    .btn.sm{padding:6px 10px;font-size:13px;font-weight:600}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:block;font-weight:600;margin-bottom:10px}
    input,select,textarea{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
    .badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
    .pending{background:#fff4e5;color:var(--warn)} .approved,.active{background:#e7f8ef;color:var(--ok)} .rejected,.inactive{background:#fdecec;color:var(--danger)}
    .alert{padding:11px 13px;border-radius:12px;margin-bottom:12px}
    .ok{background:#e7f8ef;color:var(--ok)} .err{background:#fdecec;color:var(--danger)}
    .auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,#d7f3ef,transparent 40%),radial-gradient(circle at 80% 0,#d9e6f5,var(--bg) 45%)}
    .auth-card{width:min(520px,100%)}
    .accounts{display:grid;gap:8px;margin-top:14px}
    .acc{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f6fafb;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
    @media(max-width:900px){
      .side{position:fixed;inset:0 0 0 auto;transform:translateX(110%);transition:.2s;z-index:20}
      .side.open{transform:none}
      .menu{display:inline-flex}
      .stats,.formgrid{grid-template-columns:1fr}
      .content{padding:16px}
    }
  </style>
</head>
<body>
<div id="loginView" class="auth">
  <div class="card auth-card">
    <h1 style="margin:0 0 6px">موارد</h1>
    <p class="muted">نظام موارد بشرية جاهز. لا يحتاج قاعدة بيانات. اختر حساباً للدخول مباشرة.</p>
    <div id="loginErr" class="alert err hidden"></div>
    <div class="accounts" id="quickAccounts"></div>
  </div>
</div>
<div id="appView" class="shell hidden">
  <aside class="side" id="sidebar">
    <div class="brand"><div class="logo">م</div><div><strong>موارد</strong><small>نظام الموارد البشرية</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-user">
      <div class="avatar" id="av">م</div>
      <div><strong id="whoName"></strong><small id="whoRole"></small></div>
      <button class="logout" onclick="logout()">خروج</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h1 id="pageTitle">لوحة التحكم</h1>
    </header>
    <main class="content" id="page"></main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
