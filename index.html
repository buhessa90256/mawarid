<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موارد</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="lg">
  <form class="box" onsubmit="return doLogin(event)">
    <h1>موارد</h1>
    <p class="sub">نظام شؤون الموظفين</p>
    <div id="err" class="err hidden"></div>
    <label>البريد
      <input id="email" type="text" dir="ltr" autocomplete="username">
    </label>
    <label>كلمة المرور
      <input id="pass" type="password" autocomplete="current-password">
    </label>
    <button class="pri" type="submit">دخول</button>
    <div class="demos">
      <p>حسابات جاهزة — اضغط للدخول مباشرة</p>
      <button type="button" onclick="quick('u1')"><b>مدير النظام</b><span>admin@mawarid.local</span></button>
      <button type="button" onclick="quick('u2')"><b>موارد بشرية</b><span>hr@mawarid.local</span></button>
      <button type="button" onclick="quick('u3')"><b>مدير قسم</b><span>manager@mawarid.local</span></button>
      <button type="button" onclick="quick('u4')"><b>موظف</b><span>staff@mawarid.local</span></button>
    </div>
  </form>
</div>
<div id="app" class="app hidden">
  <aside class="sb" id="sb">
    <div class="b">موارد<small>شؤون الموظفين</small></div>
    <nav id="nav"></nav>
    <div class="me"><div><b id="nm"></b><div class="m" id="rl"></div></div><button type="button" onclick="out()">خروج</button></div>
  </aside>
  <div class="col">
    <header class="hd">
      <button class="burger" type="button" onclick="sb.classList.toggle('open')">☰</button>
      <h2 id="tt">لوحة التحكم</h2>
    </header>
    <main class="pg" id="pg"></main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
